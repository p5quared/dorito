[project]
name = "producer"
version = "0.1.0"
description = "Reddit data producer service"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.11",
    "dataclasses-json>=0.6.7",
    "praw>=7.8.1",
    "shared",
]

[project.scripts]
producer = "producer.main:main"

[dependency-groups]
dev = [
    "coverage>=7.10.4",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.9",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"
